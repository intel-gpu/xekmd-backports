name: Compile OOT modules

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile-oot-modules:
    name: Compile OOT modules
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout xekmd-backports
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone backport-tools
        uses: actions/checkout@v5
        with:
          repository: intel-innersource/drivers.gpu.kernel.backport-tools
          token: ${{ secrets.BACKPORT_TOOLS_TOKEN }}
          path: backport-tools

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake autoconf-archive libtool \
            pkg-config bc flex bison libssl-dev libelf-dev wget python3 python3-pip
          pip3 install -r "${GITHUB_WORKSPACE}/backport-tools/requirements.txt"

      - name: Run backport_release (create_worktree + verify_compilation)
        working-directory: ${{ github.workspace }}/backport-tools
        run: |
          python3 xekmd-backport/backport_release.py \
            --module=XE \
            --compile-only=True \
            --out-dir="${GITHUB_WORKSPACE}/" \
            --base-dir="${GITHUB_WORKSPACE}/" \
            --skip-module-verification=True \
            --debug-run=True 
