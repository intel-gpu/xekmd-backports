name: Auto Tag on Merge

on:
  push:
    branches:
      - oot-backport/main

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOTAG_TOKEN }}

      - name: Check if this is a PR merge
        id: check-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get commit message and SHA
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=%B HEAD)
          echo "Commit SHA: $COMMIT_SHA"
          echo "Commit message: $COMMIT_MSG"
          # Check if commit has 2 parents (merge commit)
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "✅ This is a merge commit (2 parents)"
          # Check commit message for GitHub PR merge patterns
          elif echo "$COMMIT_MSG" | grep -qiE "^Merge pull request #[0-9]+"; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "✅ This is a GitHub PR merge (from commit message)"
          elif echo "$COMMIT_MSG" | head -1 | grep -qE "\(#[0-9]+\)$"; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "✅ This is a squash merge (PR number in title)"
          # Check GitHub API if commit is associated with a PR
          elif curl -s -H "Authorization: token $GH_TOKEN" \
                    "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
                    | grep -q '"number"'; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "✅ This commit is associated with a PR (via GitHub API)"
          else
            echo "is_merge=false" >> $GITHUB_OUTPUT
            echo "❌ This is NOT a PR merge, skipping tag creation"
          fi

      - name: Configure Git
        if: steps.check-merge.outputs.is_merge == 'true'
        run: |
          git config user.name "SYS SEOS AUTOBACKPORT"
          git config user.email "sys_seos_autobackport@intel.com"

      - name: Build Next xeb Tag
        if: steps.check-merge.outputs.is_merge == 'true'
        id: increment
        run: |
          # 1) Read latest existing oot-backport tag: xeb_vX.Y.Z.W_YYMMDD.R
          LAST_XEB_TAG=$(git tag -l 'xeb_*' | sort -V | tail -1)

          # 2) Fetch kernel-backport/main and find latest tag pointing at its HEAD
          git fetch origin kernel-backport/main
          KERNEL_HEAD_SHA=$(git rev-parse origin/kernel-backport/main)
          KERNEL_HEAD_TAG=$(git tag --points-at "$KERNEL_HEAD_SHA" | sort -V | tail -1)

          if [[ -z "$KERNEL_HEAD_TAG" ]]; then
            echo "No tag points to kernel-backport/main HEAD ($KERNEL_HEAD_SHA)"
            exit 1
          fi

          # 3) Build kernel stream key (v<major>.<minor>)
          #    Examples:
          #      v7.3        -> v7.3
          #      v7.3.6.4    -> v7.3
          #      v7.3-rc1    -> v7.3
          CURRENT_STREAM=$(echo "$KERNEL_HEAD_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+).*/v\1.\2/')
          CURRENT_DATE=$(date -u +%y%m%d)

          # 4) Decide date/revision policy:
          #    - First ever tag: use current date, rev 0
          #    - New stream (vX.Y changed): use current date, rev 0
          #    - Same stream: keep previous date, rev +1
          if [[ -z "$LAST_XEB_TAG" ]]; then
            TAG_DATE="$CURRENT_DATE"
            NEW_REVISION=0
            echo "No previous xeb tag, starting fresh at ${TAG_DATE}.0"
          else
            if [[ ! "$LAST_XEB_TAG" =~ ^xeb_(v[^_]+)_([0-9]{6})\.([0-9]+)$ ]]; then
              echo "Last xeb tag has unexpected format: $LAST_XEB_TAG"
              exit 1
            fi

            LAST_KERNEL_TAG="${BASH_REMATCH[1]}"
            LAST_DATE="${BASH_REMATCH[2]}"
            LAST_REVISION="${BASH_REMATCH[3]}"
            LAST_STREAM=$(echo "$LAST_KERNEL_TAG" | sed -E 's/^v([0-9]+)\.([0-9]+).*/v\1.\2/')

            if [[ "$CURRENT_STREAM" != "$LAST_STREAM" ]]; then
              TAG_DATE="$CURRENT_DATE"
              NEW_REVISION=0
              echo "Kernel stream changed: $LAST_STREAM -> $CURRENT_STREAM"
              echo "Resetting revision with current date: ${TAG_DATE}.0"
            else
              TAG_DATE="$LAST_DATE"
              NEW_REVISION=$((LAST_REVISION + 1))
              echo "Same kernel stream ($CURRENT_STREAM), incrementing revision"
            fi
          fi

          # 5) Compose new tag:
          #    xeb_<kernel-head-tag>_<tag-date>.<revision>
          NEW_TAG="xeb_${KERNEL_HEAD_TAG}_${TAG_DATE}.${NEW_REVISION}"

          echo "Last xeb tag: $LAST_XEB_TAG"
          echo "Kernel HEAD tag: $KERNEL_HEAD_TAG"
          echo "Kernel stream: $CURRENT_STREAM"
          echo "Generated tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        if: steps.check-merge.outputs.is_merge == 'true'
        env:
          NEW_TAG: ${{ steps.increment.outputs.new_tag }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Check if tag already exists (safety check)
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping"
            exit 0
          fi
          
          echo "Creating annotated tag: $NEW_TAG"
          
          # Create annotated tag with detailed message
          git tag -a "$NEW_TAG" \
            -m "Auto-generated tag for $BRANCH_NAME" \
            -m "Commit: $COMMIT_SHA" \
            -m "$COMMIT_MSG"
          
          # Push the tag
          git push origin "$NEW_TAG"
          
          echo "Successfully created and pushed tag: $NEW_TAG"
